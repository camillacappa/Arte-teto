<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L'Arte di Teto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Lexend:wght@400;500;700&display=swap">
<style>
/* Layout: una tavoletta centrale; ocra rossa delle grotte come accento, blu-ardesia della pietra, bronzo per i premi */
:root{
  --bg:#F4EEE6; --paper:#FFFDF9; --ink:#2A1F18; --muted:#6B5E54; --line:#E2D7CA;
  --acc:#9C3A1C; --acc-soft:#F6E2D8;
  --east:#3A6478; --east-soft:#DFEAF0;
  --bronze:#94691E; --bronze-soft:#F5EBD6;
  --ok:#2F7A46; --ok-soft:#E1F1E5; --ko:#B3372B; --ko-soft:#F8E1DD;
  --display:"Marcellus","Trajan Pro",Georgia,serif;
  --body:"Lexend","Avenir Next","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1A1512; --paper:#251E1A; --ink:#F2EAE2; --muted:#B0A396; --line:#3E342D;
  --acc:#F0946E; --acc-soft:#3E2519; --east:#8EBBD0; --east-soft:#1E2E36;
  --bronze:#E0B45E; --bronze-soft:#3A3020; --ok:#6CC488; --ok-soft:#1F3427; --ko:#F0897C; --ko-soft:#3D2522; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1A1512; --paper:#251E1A; --ink:#F2EAE2; --muted:#B0A396; --line:#3E342D;
  --acc:#F0946E; --acc-soft:#3E2519; --east:#8EBBD0; --east-soft:#1E2E36;
  --bronze:#E0B45E; --bronze-soft:#3A3020; --ok:#6CC488; --ok-soft:#1F3427; --ko:#F0897C; --ko-soft:#3D2522; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink); font-family:var(--body); font-size:18px; line-height:1.55; padding-inline:16px; padding-block:12px 60px; -webkit-tap-highlight-color:transparent}
.wrap{max-width:860px; margin:0 auto; display:flex; flex-direction:column; gap:18px}
h1,h2,h3{font-family:var(--display); font-weight:400; margin:0; line-height:1.15; text-wrap:balance}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible{outline:3px solid var(--acc); outline-offset:2px}
.frieze{height:8px; background:repeating-linear-gradient(90deg,var(--acc) 0 14px,transparent 14px 18px,var(--bronze) 18px 24px,transparent 24px 28px); opacity:.85; border-radius:2px}

.top{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:10px; flex:1 1 auto; min-width:0}
.brand h1{font-size:clamp(24px,4.4vw,34px); letter-spacing:.03em}
.brand h1 span{color:var(--acc)}
.brand small{display:block; font-size:14px; color:var(--muted); letter-spacing:.12em; text-transform:uppercase}
.grade{display:flex; align-items:center; gap:8px; background:var(--paper); border:1px solid var(--line); border-radius:999px; padding:6px 14px 6px 8px; font-size:15px}
.grade b{font-family:var(--display); font-size:17px}
.grade .pts{font-variant-numeric:tabular-nums; color:var(--muted)}
.grade .dot{width:28px; height:28px; border-radius:50%; background:var(--bronze); color:var(--paper); display:grid; place-items:center; font-size:13px; font-weight:700}

.tabs{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:6px}
.tabs button{border:0; background:transparent; border-radius:11px; padding:10px 4px; font-size:15px; font-weight:500; display:flex; flex-direction:column; align-items:center; gap:2px; color:var(--muted)}
.tabs button svg{width:24px; height:24px}
.tabs button[aria-current="true"]{background:var(--acc-soft); color:var(--acc); font-weight:700}

.marco{display:flex; align-items:flex-end; gap:10px}
.marco svg{width:72px; height:72px; flex:none}
.bubble{background:var(--paper); border:2px solid var(--ink); border-radius:18px 18px 18px 4px; padding:10px 14px; font-size:17px; line-height:1.45; min-width:0}
.bubble .who{display:block; font-family:var(--display); font-size:14px; letter-spacing:.14em; color:var(--acc)}

.panel{background:var(--paper); border:1px solid var(--line); border-radius:18px; padding:18px}
.secLabel{font-family:var(--display); font-size:22px; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.secLabel small{font-family:var(--body); color:var(--muted); font-size:14px}

/* Studia */
.sez{background:var(--paper); border:1px solid var(--line); border-radius:16px; overflow:hidden}
.sez summary{list-style:none; cursor:pointer; padding:14px 16px; display:flex; align-items:center; gap:12px}
.sez summary::-webkit-details-marker{display:none}
.sez .pg{font-family:var(--display); color:var(--acc); background:var(--acc-soft); border-radius:10px; min-width:46px; text-align:center; padding:4px 6px; font-size:15px; flex:none}
.sez .tt{font-weight:700; flex:1; min-width:0}
.sez .chev{transition:transform .2s; color:var(--muted)}
.sez[open] .chev{transform:rotate(90deg)}
.sez .body{padding:0 18px 16px; display:flex; flex-direction:column; gap:10px}
.sez ul{margin:0; padding-left:22px; display:flex; flex-direction:column; gap:8px; max-width:65ch}
.sez b{color:var(--acc)}
.sez .d{font-variant-numeric:tabular-nums; background:var(--bronze-soft); color:var(--bronze); border-radius:6px; padding:0 5px; font-weight:700}
.row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.btn{border:2px solid var(--acc); background:var(--acc); color:var(--paper); border-radius:14px; padding:10px 18px; font-weight:700; display:inline-flex; align-items:center; gap:8px}
.btn.ghost{background:transparent; color:var(--acc)}
.btn.small{padding:6px 12px; font-size:15px; border-radius:11px}
.btn svg{width:20px; height:20px}
.btn[disabled]{opacity:.45; cursor:default}
.subtabs{display:flex; gap:6px; flex-wrap:wrap}
.subtabs button{border:1px solid var(--line); background:var(--paper); border-radius:999px; padding:8px 16px; font-size:15px}
.subtabs button[aria-current="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.gloss{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:10px}
.word{background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:12px 14px; min-width:0}
.word b{font-family:var(--display); font-size:19px; display:block; color:var(--acc)}
.word span{font-size:16px}
.word i{display:block; font-style:normal; color:var(--muted); font-size:13px; margin-top:4px}
.tl{position:relative; display:flex; flex-direction:column; gap:10px; padding-left:28px}
.tl::before{content:""; position:absolute; left:9px; top:6px; bottom:6px; width:3px; background:var(--line); border-radius:2px}
.tl .ev{position:relative; background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:10px 14px; display:grid; grid-template-columns:112px 1fr; gap:10px; align-items:baseline}
.tl .ev::before{content:""; position:absolute; left:-25px; top:16px; width:13px; height:13px; border-radius:50%; background:var(--acc); box-shadow:0 0 0 3px var(--bg)}
.tl .ev.big::before{background:var(--bronze); width:17px; height:17px; left:-27px; top:14px}
.tl .ev b{font-family:var(--display); font-size:18px; color:var(--acc); font-variant-numeric:tabular-nums}
.tl .ev.big{border-color:var(--bronze); background:var(--bronze-soft)}
.tl .era{font-family:var(--display); color:var(--muted); letter-spacing:.14em; text-transform:uppercase; font-size:14px}

/* Giochi */
.games{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px}
.game{background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:16px; text-align:left; display:flex; flex-direction:column; gap:6px; min-width:0}
.game .ic{width:44px; height:44px; border-radius:12px; display:grid; place-items:center; background:var(--acc-soft); color:var(--acc)}
.game .ic svg{width:26px; height:26px}
.game.e .ic{background:var(--east-soft); color:var(--east)}
.game.b .ic{background:var(--bronze-soft); color:var(--bronze)}
.game b{font-family:var(--display); font-size:20px; font-weight:400}
.game span{font-size:15px; color:var(--muted)}
.game .best{font-size:13px; color:var(--bronze); font-weight:700}
.game.star{border:2px solid var(--bronze); background:linear-gradient(var(--bronze-soft),var(--paper))}

.play{display:flex; flex-direction:column; gap:14px}
.phead{display:flex; align-items:center; gap:10px}
.phead .back{border:1px solid var(--line); background:var(--paper); border-radius:12px; padding:8px 12px; display:flex; align-items:center; gap:4px; font-size:15px}
.phead h2{flex:1; font-size:22px; min-width:0}
.prog{height:10px; background:var(--line); border-radius:6px; overflow:hidden}
.prog i{display:block; height:100%; background:var(--acc); transition:width .3s}
.qbox{background:var(--paper); border:1px solid var(--line); border-radius:18px; padding:20px; display:flex; flex-direction:column; gap:16px}
.qline{display:flex; gap:12px; align-items:flex-start}
.q{font-family:var(--display); font-size:clamp(22px,3.8vw,28px); line-height:1.3; flex:1; min-width:0}
.speak{flex:none; width:46px; height:46px; border-radius:50%; border:2px solid var(--line); background:var(--paper); display:grid; place-items:center; color:var(--acc)}
.speak svg{width:22px; height:22px}
.opts{display:grid; grid-template-columns:1fr 1fr; gap:10px}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{border:2px solid var(--line); background:var(--paper); border-radius:14px; padding:14px 16px; text-align:left; font-size:18px; min-height:62px; transition:transform .1s}
.opt:active{transform:scale(.98)}
.opt.ok{border-color:var(--ok); background:var(--ok-soft)}
.opt.ko{border-color:var(--ko); background:var(--ko-soft); opacity:.75}
.opt[disabled]{cursor:default}
.vf{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.vf .opt{text-align:center; font-family:var(--display); font-size:26px; min-height:84px}
.fb{border-radius:14px; padding:12px 16px; font-size:17px}
.fb.ok{background:var(--ok-soft); color:var(--ok)}
.fb.ko{background:var(--ko-soft); color:var(--ko)}
.fb.hint{background:var(--bronze-soft); color:var(--bronze)}
.fb p{margin:4px 0 0; color:var(--ink)}
.pag{display:inline-block; font-size:13px; font-weight:700; border:1px solid currentColor; border-radius:999px; padding:0 8px; margin-left:6px}
.meta{display:flex; justify-content:space-between; gap:10px; color:var(--muted); font-size:15px; font-variant-numeric:tabular-nums}
.clues{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:8px}
.clues li{background:var(--bronze-soft); border-radius:12px; padding:10px 14px}
.clues li b{font-family:var(--display); color:var(--bronze); margin-right:6px}
.clues li.hid{background:transparent; border:2px dashed var(--line); color:var(--muted)}

.chips{display:flex; flex-wrap:wrap; gap:10px}
.chip{border:2px solid var(--line); background:var(--paper); border-radius:14px; padding:12px 14px; text-align:left; font-size:17px; flex:1 1 220px; min-width:0}
.chip.ko{animation:shake .35s; border-color:var(--ko)}
.chip.sel{border-color:var(--acc); background:var(--acc-soft)}
.chip.done{border-color:var(--ok); background:var(--ok-soft); opacity:.7; cursor:default}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.chip.ko{animation:none}.prog i{transition:none}}
.placed{display:flex; flex-direction:column; gap:8px}
.placed div{display:grid; grid-template-columns:110px 1fr; gap:10px; background:var(--ok-soft); border-radius:12px; padding:10px 14px}
.placed b{font-family:var(--display); color:var(--ok); font-variant-numeric:tabular-nums}
.match{display:grid; grid-template-columns:1fr 1.6fr; gap:10px}
.match .col{display:flex; flex-direction:column; gap:10px; min-width:0}
.match .chip{flex:none}
.match .col:first-child .chip{font-family:var(--display); font-size:19px}
.card1{background:var(--paper); border:3px solid var(--ink); border-radius:18px; padding:22px; text-align:center; font-size:21px; font-weight:500}
.bins{display:grid; gap:10px}
.bin{--c:var(--acc); border:3px solid var(--c); background:var(--paper); border-radius:16px; padding:14px 8px; font-family:var(--display); font-size:clamp(16px,2.6vw,20px); color:var(--c); min-height:70px}
.bin.e{--c:var(--east)} .bin.b{--c:var(--bronze)}
.bin.ok{background:var(--ok-soft); border-color:var(--ok); color:var(--ok)}
.bin.ko{background:var(--ko-soft); border-color:var(--ko); color:var(--ko)}

.end{display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center}
.score{font-family:var(--display); font-size:clamp(44px,9vw,72px); color:var(--acc); line-height:1}
.voto{width:140px; height:140px; border-radius:50%; background:var(--bronze); color:var(--paper); display:grid; place-items:center; font-family:var(--display); font-size:58px; box-shadow:inset 0 0 0 6px var(--paper),0 0 0 4px var(--bronze)}
.review{display:flex; flex-direction:column; gap:10px; width:100%; text-align:left}
.review div{border:1px solid var(--line); border-radius:12px; padding:10px 14px; background:var(--paper)}
.review .r{color:var(--ok); font-weight:700}
.review .w{color:var(--ko); text-decoration:line-through}

.ranks{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
@media (max-width:560px){.ranks{grid-template-columns:repeat(2,1fr)}}
.rk{border:1px solid var(--line); border-radius:14px; padding:12px; text-align:center; background:var(--paper)}
.rk b{display:block; font-family:var(--display); font-size:18px; font-weight:400}
.rk span{font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
.rk.on{border:2px solid var(--bronze); background:var(--bronze-soft)}
.rk.lock{opacity:.45}
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.stat{background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:12px; text-align:center}
.stat b{display:block; font-family:var(--display); font-size:30px; font-variant-numeric:tabular-nums; color:var(--acc)}
.stat span{font-size:14px; color:var(--muted)}
.sezbar{display:grid; grid-template-columns:minmax(0,1fr) 120px 44px; gap:10px; align-items:center; font-size:15px}
.sezbar .bar{height:10px; border-radius:6px; background:var(--line); overflow:hidden}
.sezbar .bar i{display:block; height:100%; background:var(--east)}
.sezbar span:last-child{text-align:right; color:var(--muted); font-variant-numeric:tabular-nums}
.toggle{display:flex; align-items:center; gap:10px; font-size:16px}
.toggle input{width:22px; height:22px; accent-color:var(--acc)}
.note{font-size:14px; color:var(--muted)}
.confirm{display:flex; gap:8px; align-items:center; flex-wrap:wrap}

/* Capitolo Mesopotamia: blu lapislazzuli al posto dell'ocra */
:root[data-cap="meso"]{--acc:#2C4FA3; --acc-soft:#E1E8F8; --east:#2F7A72; --east-soft:#DDF0EC}
@media (prefers-color-scheme: dark){:root[data-cap="meso"]:not([data-theme="light"]){--acc:#8FA9F0; --acc-soft:#1F2A47; --east:#7CCBBE; --east-soft:#1B3330}}
:root[data-cap="meso"][data-theme="dark"]{--acc:#8FA9F0; --acc-soft:#1F2A47; --east:#7CCBBE; --east-soft:#1B3330}
.capsw{display:grid; grid-template-columns:1fr 1fr; gap:6px; background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:5px}
.capsw button{border:0; background:transparent; border-radius:10px; padding:8px 6px; font-size:15px; color:var(--muted); line-height:1.25}
.capsw button small{display:block; font-size:12px; letter-spacing:.08em; text-transform:uppercase}
.capsw button[aria-current="true"]{background:var(--ink); color:var(--paper); font-weight:700}
</style>
</head>
<body>

<div class="wrap" id="app"></div>

<script>
/* ============ CONTENUTI (solo dalle foto del libro: cap. 1 «L'arte della Preistoria», pp. 24–38) ============ */
let SEZ=[
 {id:"s1",t:"Che cos'è la Preistoria",p:26,punti:[
  "La **Preistoria** va dalla **comparsa dei primi mammiferi del genere Homo** (circa [2,5 milioni di anni fa]) fino all'**invenzione della scrittura** (intorno al [3200 a.C.]).",
  "Circa [2 milioni di anni fa] gli uomini iniziano a fabbricare **strumenti**: comincia l'**Età della pietra**, chiamata così per il materiale con cui erano fatti.",
  "Sappiamo come vivevano grazie all'**archeologia**, che cerca, porta alla luce e studia le **tracce** lasciate dai nostri antenati.",
  "Queste testimonianze mostrano il **progredire delle loro abilità** e la nascita, circa [40.000 anni fa], delle **prime forme d'arte**."]},
 {id:"s2",t:"L'Età della pietra: Paleolitico, Mesolitico, Neolitico",p:26,punti:[
  "L'Età della pietra si divide in **tre grandi periodi**.",
  "**Paleolitico** («pietra antica»): da circa [2 milioni di anni fa] al [10.000 a.C.]. L'uomo è un **cacciatore nomade**, vive in piccoli gruppi di famiglie, si ripara nelle **caverne** e usa il **fuoco** per scaldarsi. Compare l'**Homo sapiens**.",
  "**Mesolitico** («pietra di mezzo»): dall'ultima glaciazione ([10.000 a.C.]) al [6000 a.C.]. L'ambiente cambia molto, ma l'uomo vive più o meno come nel Paleolitico.",
  "**Neolitico** («pietra nuova»): dal [6000 a.C.] al [4000 a.C.]. L'uomo diventa **stanziale**: costruisce **villaggi** e **palafitte** (capanne sopraelevate su pali) e le prime **necropoli** (le «città dei morti»).",
  "Nel Neolitico da cacciatore nomade diventa **agricoltore**, commercia con il **baratto** e comincia a lavorare la **ceramica**."]},
 {id:"s3",t:"L'Età dei metalli e le prime forme d'arte",p:26,punti:[
  "Intorno al [4000 a.C.] inizia l'**Età dei metalli**: per strumenti e armi si usa il **metallo** al posto della pietra.",
  "Si divide in **Età del rame**, **Età del bronzo** ed **Età del ferro**, secondo il metallo più diffuso. Continua anche **dopo la fine della Preistoria**.",
  "Le **prime forme d'arte** risalgono all'ultima fase del Paleolitico ([35.000–10.000 a.C.]): sono le **pitture rupestri**, cioè pitture sulle pareti di roccia delle caverne.",
  "Nel Paleolitico nascono anche le **prime sculture**, quasi sempre **piccole**, con **figure femminili e animali**.",
  "Nel **Neolitico**, quando l'uomo diventa stanziale, nascono le prime **grandi costruzioni in pietra**."]},
 {id:"s4",t:"Pittura: perché dipingevano le caverne",p:28,punti:[
  "La pittura sulle pareti delle caverne è **la più antica forma d'arte** degli esseri umani. Pitture rupestri sono state trovate **in tutto il mondo**.",
  "Raffigurano soprattutto **scene di caccia** e **animali**: bisonti, cervi, cavalli, tori e anche animali oggi estinti come i **mammut**.",
  "Non sappiamo con certezza a cosa servissero: forse a raccontare la vita di ogni giorno o, più probabilmente, erano **immagini propiziatorie**, cioè servivano a ottenere il **favore delle forze della natura**.",
  "Ci mostrano che l'**Homo sapiens era un abile disegnatore**.",
  "Le pitture rupestri continuano per millenni; nel **Mesolitico** si aggiunge una nuova tecnica: l'**incisione su roccia**."]},
 {id:"s5",t:"Le grotte dipinte in Europa",p:28,punti:[
  "Le zone più grandi con pitture rupestri sono in **Francia** e in **Spagna**, e sono state scoperte tutte **per caso**.",
  "**Grotta di Chauvet** (Francia): la **più antica** ([36.000–32.000 anni fa]) e la **più ricca di figure**. È stata trovata solo nel [1994]. Qui c'è l'**Impronta di mano** ([30.000 a.C.] ca.).",
  "**Grotta di Lascaux** (Francia): risale a circa [21.000 anni fa] ed è stata scoperta nel [1940]. È lunga **oltre 200 metri** e ha **tre diramazioni**.",
  "A Lascaux ci sono migliaia di disegni: **più di 6000 animali** (cavalli, bisonti, cervi, leoni, orsi, rinoceronti) e **una sola figura umana**. Molti animali sono circondati dalle **frecce dei cacciatori**. Famosa la **Sala dei tori** ([16.000–14.000 a.C.]).",
  "**Grotta di Altamira** (Spagna): è conosciuta dalla **fine dell'Ottocento**; le figure risalgono a [19.000–18.000 anni fa]."]},
 {id:"s6",t:"Materiali e tecniche della pittura",p:28,p2:29,punti:[
  "Si partiva dalla **linea di contorno**, fatta con i **carboncini** rimasti dai fuochi spenti.",
  "Poi si colorava con **terre e minerali pestati** (ocra, rosso, bruno) mescolati a sostanze che funzionavano da **colla**: **grasso animale** o **sostanze vegetali**.",
  "I colori si stendevano con le **dita**, con **pennelli** fatti di **peli animali**, oppure venivano **soffiati** (una specie di «**tecnica spray**»): il colore si metteva in **ossa cave** e si soffiava sulla parete, o si spruzzava con la **bocca**.",
  "Spesso l'artista **sfruttava il colore naturale della roccia**, come nel **Cavallo con frecce** di Lascaux: dipingeva solo la parte del pelo di colore diverso dalla pietra.",
  "I disegni sono spesso **in alto**: forse si costruivano dei **ponteggi** per lavorare.",
  "Gli artisti rispettavano le **proporzioni** degli animali in modo **realistico**."]},
 {id:"s7",t:"Le incisioni rupestri",p:29,punti:[
  "I primi **graffiti**, o **incisioni rupestri**, risalgono a circa [10.000 anni fa] e continuano fino all'**Età del ferro** ([1000–500 a.C.]).",
  "Si facevano **incidendo segni** su massi e pareti con **rocce dure** come le **selci**; più tardi, nell'Età del ferro, con **punte metalliche**.",
  "Le incisioni della **Valle Camonica** (provincia di **Brescia**), dell'Età del ferro, mostrano **scene di caccia**, **vita quotidiana** e **cerimonie rituali**.",
  "Sono **molto meno realistiche** delle pitture del Paleolitico: animali, uomini e attrezzi sono disegnati **in modo schematico**.",
  "Esempio: l'**Incisione con carro** (Naquane, Capo di Ponte): il carro è **visto dall'alto**, con le ruote affiancate, mentre gli animali sono **di fianco**, uno sopra l'altro. Così si mostrava un oggetto **da più punti di vista nello stesso momento**."]},
 {id:"s8",t:"Le prime sculture del Paleolitico",p:30,punti:[
  "Le prime sculture dell'Homo sapiens sono **statuette** di **figure femminili e animali**, in **pietra**, **osso** e **avorio**.",
  "Servivano probabilmente a ottenere la **protezione delle forze della natura**, da cui dipendeva la sopravvivenza.",
  "Sono tutte **piccole**, forse perché le comunità **nomadi** dovevano poterle **trasportare**.",
  "La **Signora di Brassempouy** ([23.000 a.C.] ca., **avorio**, alta 3,65 cm) è la **più antica rappresentazione di un volto umano**: su una **zanna d'avorio** sono incisi con cura viso e capelli.",
  "Le statuette più numerose sono le **«Veneri»** (come la dea greca dell'amore e della bellezza): mettono in evidenza **seno e ventre**. Servivano forse a **favorire la fecondità** delle donne: più figli = più cacciatori e raccoglitori per procurarsi il cibo.",
  "Molte sono a **tuttotondo**, altre a **rilievo**, come la **Venere di Laussel** ([23.000 a.C.] ca., bassorilievo su calcare), con un **corno di bisonte** in mano: lo scultore ha usato la parte **convessa** della pietra per far sporgere il ventre."]},
 {id:"s9",t:"Lettura d'opera: la Venere di Willendorf",p:32,punti:[
  "È una **piccola scultura** che raffigura **una donna**. Prende il nome dalla località in **Austria** dove fu scoperta. L'**autore è sconosciuto**.",
  "Oggi è conservata a **Vienna**, al **Museo di Storia Naturale**.",
  "È alta **appena 11 cm**, in **pietra calcarea**, fatta con la tecnica del **tuttotondo**. Risale a circa [25.000 anni fa].",
  "Il volto è **nascosto da un copricapo**, forse una **cuffia** fatta cucendo tante **conchiglie**.",
  "Il corpo è **morbido e abbondante** e i seni grandi fanno pensare che sia **incinta**. **Braccia** e **piedi** sono poco visibili: lo scultore li ha solo **abbozzati**.",
  "Era forse un oggetto **di buon auspicio**: nuovi figli volevano dire la **sopravvivenza del gruppo** e più persone per procurarsi il cibo."]},
 {id:"s10",t:"Statue-stele e bronzi nuragici",p:31,punti:[
  "L'arte del **Neolitico** si riconosce per la **semplificazione delle forme**. Nascono le **statue-stele**: **lastre di pietra** scolpite con forme **antropomorfe** (cioè umane).",
  "La **Dama di Saint-Sernin** ([III millennio a.C.], pietra arenaria, Francia) è una figura femminile a **bassorilievo**: si riconoscono occhi, braccia, seni e gambe.",
  "Forse era una **divinità** messa a **difesa di una sepoltura o di un villaggio**. È una delle più antiche rappresentazioni della figura umana.",
  "Nell'**Età dei metalli** si fanno sculture anche in **bronzo**: tantissime statuette sono state trovate in **Sardegna**, soprattutto nelle **sepolture**.",
  "La **Madre dell'ucciso** ([VII secolo a.C.], bronzo, alta 10 cm, Cagliari): una donna seduta su uno **sgabello** tiene in grembo un **uomo morto**, forse il **figlio morto in battaglia** (sul petto ha un **pugnale corto**, l'arma dei guerrieri nuragici).",
  "La posa fa pensare all'**offerta alla divinità** del sacrificio del figlio da parte della madre."]},
 {id:"s11",t:"Le architetture megalitiche",p:33,punti:[
  "Dal **V millennio a.C.** in Europa si diffondono le **costruzioni megalitiche**, o **megaliti** (dal greco *mégas* = grande e *líthos* = pietra), fatte con **grandi pietre**.",
  "La loro funzione **non è sempre chiara**: forse **riti religiosi**, **sepoltura dei morti** e **osservazione dei fenomeni celesti**.",
  "Richiedevano **sforzi enormi**: per costruirli si fermavano anche **caccia, allevamento e agricoltura**. Per questo dovevano avere un **significato importantissimo**.",
  "**Menhir** (dal bretone «**pietra lunga**»): **un unico blocco** di pietra piantato nel terreno **in verticale**. Spesso sono in lunghe file dette **allineamenti** (Carnac, Francia). Trucco: pensa a **Obelix** con il masso sulle spalle!",
  "**Dolmen** (dal bretone «**tavola di pietra**»): **due grandi pietre verticali** e **una orizzontale** sopra, come copertura (Dolmen della **Chianca**, Bisceglie).",
  "Il dolmen usa il **sistema trilitico** («fatto di tre pietre»), che è alla base dell'architettura: due **piedritti** verticali reggono il peso dell'**architrave** orizzontale.",
  "**Cromlech** (dal gallese «**pietra ricurva**»): **dolmen disposti in cerchio**. Il più famoso è **Stonehenge**, in Gran Bretagna."]},
 {id:"s12",t:"Il cromlech di Stonehenge",p:34,punti:[
  "Si trova a **Salisbury** (Regno Unito). Fu costruito in **tre periodi diversi**, tra il [3100] e il [1500 a.C.] circa.",
  "Oggi restano parti di **due anelli concentrici di dolmen**, alti **fino a 7 metri** (diametro esterno circa 31 m).",
  "La funzione non è certa: per la posizione delle pietre rispetto al **Sole**, si pensa che qui si facessero **riti legati ai movimenti del Sole** e che fosse un **gigantesco calendario**.",
  "Nella pianta si vedono il **cerchio dei triliti**, il **cerchio dei monoliti**, triliti e monoliti **a ferro di cavallo** e la direzione dei raggi del sole nel **solstizio d'estate**.",
  "Le pietre venivano dalla **Scozia**, a **oltre 700 km**, e pesano **fino a 25 tonnellate**: forse furono trasportate con **rulli**, **slitte** e **per mare**. Questo dimostra le grandi **capacità organizzative e tecniche** delle comunità neolitiche."]},
 {id:"s13",t:"I nuraghi",p:35,punti:[
  "I **nuraghi** sono costruzioni megalitiche che esistono **solo in Sardegna**: da loro prende il nome la **civiltà nuragica**. Si costruiscono a partire dal **II millennio a.C.**",
  "Sono **torri a forma di tronco di cono**, fatte con grosse pietre messe una sull'altra **a secco**, cioè **senza materiali leganti**.",
  "La funzione cambiava da un complesso all'altro: forse **torri di avvistamento e di difesa** e **depositi per gli alimenti**.",
  "Non erano isolati, ma **in gruppi numerosi**. Il complesso meglio conservato è **Su Nuraxi** a **Barùmini** (Cagliari, dal [1500 a.C.] al III secolo d.C.).",
  "Esempio: il **Nuraghe Santa Barbara** (Macomer, Nuoro), del [XV secolo a.C.].",
  "*Attenzione: sul libro c'è scritto «II millennio d.C.», ma è un errore di stampa: è a.C. (lo confermano le date sotto le foto).*"]}
];

/* ============ CAPITOLO 2 · MESOPOTAMIA (foto del libro cap. 2 «L'arte delle civiltà fluviali», pp. 42–47 + mappe e schede) ============ */
const CAP_MESO={
SEZ:[
 {id:"m1",t:"Le civiltà fluviali e la Mesopotamia",p:42,punti:[
  "«**Civiltà fluviali**» sono le culture nate tra il [V e il I millennio a.C.] lungo il corso di **grandi fiumi**.",
  "Sulle rive del **Tigri** e dell'**Eufrate** fiorirono le **civiltà mesopotamiche**; sulle sponde del **Nilo** la **civiltà egizia**.",
  "In greco **Mesopotamia** significa «**terra tra i fiumi**». Oggi corrisponde ai territori di **Iraq, Iran e Siria**.",
  "Qui nacquero invenzioni fondamentali come la **scrittura** e la **ruota**, le **prime religioni** e le **prime forme di potere**."]},
 {id:"m2",t:"L'agricoltura e la nascita delle città",p:42,punti:[
  "La pianura mesopotamica è abitata almeno dal [IX millennio a.C.]. La gente viveva in **villaggi**.",
  "Con opere di **canalizzazione** impararono a regolare il Tigri e l'Eufrate: aumentò la **fertilità del terreno**.",
  "L'agricoltura fu aiutata dall'**aratro** (lavoro meno pesante) e dalla **ruota** (trasporti più facili).",
  "Per gestire i tanti prodotti agricoli nacquero le **città**, con case, strade, botteghe e magazzini: diventarono **centri del potere**, guidati da un **sovrano**.",
  "Il passaggio dai villaggi del Neolitico alle città si chiama «**rivoluzione urbana**»."]},
 {id:"m3",t:"Una terra per tre popoli",p:42,punti:[
  "**Sumeri** (dal [4000] al [1700 a.C.]): città di **Ur**, **Lagash** e **Uruk**, governate da sovrani.",
  "**Babilonesi** (dal [2000] al [539 a.C.]): grande territorio con capitale **Babilonia**.",
  "**Assiri** (dal [1100] al [612 a.C.]): fondarono un impero con capitale **Ninive**.",
  "*Nelle mappe trovi anche gli **Accadi** e i **Persiani**, altri popoli che dominarono quest'area.*"]},
 {id:"m4",t:"La scrittura, la religione, il potere",p:42,punti:[
  "La **scrittura** segna il passaggio dalla preistoria alla storia. La inventarono i **Sumeri**.",
  "Due esigenze: **stendere elenchi** dei prodotti agricoli e **condividere regole** chiare per amministrare le città.",
  "Con i sovrani la scrittura servì anche per **tenere traccia** di ciò che stabilivano.",
  "**Stele di Hammurabi** (prima metà del [XVIII secolo a.C.], basalto, Louvre): in alto il re **Hammurabi** incontra il **dio del Sole**; sotto, **8000 parole** in **caratteri cuneiformi** (a forma di cuneo). È una delle **prime raccolte di leggi** della storia.",
  "Nacquero le prime **religioni**, con il **culto di divinità**: il dio del Sole sumero **Shamash** e la dea babilonese **Ishtar**, protettrice dell'**amore e della guerra**.",
  "C'era uno **stretto legame tra religione e potere**: il sovrano poteva garantire agli uomini il **favore degli dèi**."]},
 {id:"m5",t:"L'architettura e l'invenzione del mattone",p:44,punti:[
  "Sumeri e Babilonesi costruirono edifici per **celebrare il potere dei sovrani** e **onorare le divinità**.",
  "Le città erano difese da **possenti mura** con **maestose porte**, che i Babilonesi abbellirono con immagini eleganti e colorate.",
  "In Mesopotamia mancavano **legname** e **cave di pietra**, ma c'era tanta **argilla** lungo i fiumi: nacque il **mattone**.",
  "L'argilla veniva **mischiata a sabbia e paglia tritata**, poi schiacciata in **cassette di legno** a forma di **parallelepipedo**.",
  "Prima il mattone si faceva **seccare al sole** (mattone **crudo**), poi si cominciò a **cuocerlo in forno** (mattone **cotto**): così era **più resistente**.",
  "*Dalle mappe:* il mattone era **economico**, si poteva fare **direttamente sul posto** e permetteva di costruire **dove non c'erano cave di pietra**."]},
 {id:"m6",t:"La ziqqurat",p:44,punti:[
  "**Ziqqurat** (si scrive anche *ziggurat*) significa «**essere elevato**»: rappresentava il **legame tra terra e cielo**.",
  "È un edificio gigantesco **in mattoni**, fatto di **3–8 gradoni** sovrapposti a forma di **tronchi di piramide**.",
  "Dentro c'erano **sale di rappresentanza**, **magazzini** e **depositi d'acqua**; **in cima** un **tempio**, nel luogo più vicino al cielo.",
  "Le **scale** per salire erano **esterne**. **Niente finestre**: le aperture davano su **cortili interni ombreggiati**, per tenere fresco.",
  "La **ziqqurat di Ur** fu costruita intorno al [2100 a.C.] dal re sumero **Ur-Nammu** in onore del **dio della luna Nannar**. Aveva almeno **tre piani**; la ricostruzione di oggi ne ha **uno**.",
  "Dentro la muratura è in **mattoni crudi**, fuori in **mattoni cotti**, più resistenti nel tempo.",
  "*Dalle mappe:* la ziqqurat era il **centro della vita religiosa, economica e politica**: area sacra in cima, funzioni pubbliche alla base (magazzini, granai, scuole, botteghe)."]},
 {id:"m7",t:"Lo splendore di Babilonia e la Porta di Ishtar",p:45,punti:[
  "Con il re **Nabucodonosor II** ([604–562 a.C.]) Babilonia raggiunse il massimo splendore.",
  "Era circondata da **mura in mattoni** con **250 torri** e **8 porte**; era famosa per i **giardini pensili**, cioè coltivati **su terrazze** (una delle **7 meraviglie** del mondo antico).",
  "La **Porta di Ishtar**, dedicata alla dea dell'amore e della guerra, era la **principale delle otto porte**. Da qui partiva la **via delle processioni** verso una grande ziqqurat.",
  "La porta e la via erano rivestite di **mattonelle invetriate** con **leoni, draghi e tori**, rappresentati **di profilo**, **in movimento** e **a rilievo**.",
  "Oggi una **ricostruzione** (con parti originali) è al **Pergamonmuseum di Berlino**: alta **14,75 m**, larga **15,70 m**.",
  "**Invetriatura**: sull'argilla si stende una miscela di sabbia e altre sostanze che, dopo la cottura, diventa **come vetro**: la terracotta è **impermeabile e brillante**.",
  "*Dalle mappe:* il **toro** era il simbolo di **Adad**, dio della tempesta; il **drago** era il simbolo di **Marduk**, protettore della città."]},
 {id:"m8",t:"La Torre di Babele",p:45,punti:[
  "È un **edificio leggendario** di cui parla la **Bibbia**, nella città di Babilonia.",
  "Gli uomini volevano costruire una torre che **arrivasse al cielo**, per ambizione.",
  "Dio **confuse le loro lingue**: non riuscivano più a capirsi e si dispersero sulla Terra.",
  "Questo **mito** spiega l'origine delle **diverse lingue e culture**; è una **metafora dell'arroganza umana** e della mancanza di umiltà."]},
 {id:"m9",t:"La scultura e le statuette degli oranti",p:46,punti:[
  "Le sculture più antiche sono dei **Sumeri**: raffigurano **divinità** e **oranti** (uomini in preghiera).",
  "Sono statue **piccole**, di **gesso, alabastro o terracotta**, quasi sempre **a tuttotondo**.",
  "Si sviluppò anche la **scultura a rilievo**, per la religione e per **celebrare i sovrani**.",
  "Dal [IX secolo a.C.] gli **Assiri** fecero rilievi e **imponenti statue** di esseri soprannaturali a protezione delle città: i **Lamassu**.",
  "Le statuette degli oranti si lasciavano **dentro i templi** o si seppellivano **nelle fondamenta**, per affidare il cantiere alla divinità.",
  "La **Statua di orante** (forse **Eannatum**, re sumero di **Lagash**) ha le **mani giunte**, un **gonnellino a ciocche di lana**, il corpo **sproporzionato** e **occhi grandi e sbarrati**: indicano **devozione e concentrazione**."]},
 {id:"m10",t:"Pittura e bassorilievi: la Stele di Naram-Sin",p:46,punti:[
  "Della **pittura** mesopotamica ci sono rimasti **pochissimi** resti: i più famosi sono i **dipinti parietali** del **Palazzo Reale di Zimri-Lim a Mari**.",
  "La **Stele di Naram-Sin** ([2250 a.C.] ca., Louvre) è un **bassorilievo**: celebra il **trionfo** del re **Naram-Sin** sul popolo dei **Lullubi**.",
  "Il re guida l'esercito, è **più grande** dei soldati, armato di **lancia e arco**, e porta un **copricapo con le corna**, simbolo della sua **natura divina**.",
  "La battaglia si svolge in **montagna** (dove vivevano i Lullubi): si vedono un **rilievo** e un **albero**.",
  "I **due astri** in alto indicano la **protezione degli dèi** sull'impresa.",
  "*Dalla scheda:* si legge **dal basso** (i guerrieri) **verso l'alto** (il re); a sinistra i **vincitori**, a destra i **nemici vinti**. *La scheda la chiama «accadica» e dice «calcare»: il libro dice «arenaria».*"]},
 {id:"m11",t:"I Lamassu e lo Stendardo di Ur",p:47,punti:[
  "Il re assiro **Sargon II** ([721–705 a.C.]) fece costruire un grande palazzo, protetto da due enormi **Lamassu**.",
  "I Lamassu sono **creature alate** con **corpo di toro** e **testa umana**. La testa è **a tuttotondo**, il resto è in **altorilievo**.",
  "Hanno **5 zampe**: **di fronte** sembrano **fermi**, **di lato** sembrano **in movimento**. *(Dalle mappe: erano spiriti buoni che difendevano i palazzi dalle forze del male.)*",
  "Lo **Stendardo di Ur** ([2550 a.C.] ca., British Museum) fu trovato in una **tomba regale a Ur**, capitale sumera. Non si sa bene cosa fosse: un **vessillo**, la cassa di uno **strumento musicale** o un **contenitore** prezioso.",
  "È in **legno** rivestito di tessere di **lapislazzuli** (pietra blu rara e preziosa), **pietra calcarea rossastra** e **conchiglie**: questa tecnica si chiama **intarsio**.",
  "Ha due lati: uno **di guerra** e uno **di pace**. Le storie si leggono **dal basso verso l'alto** e finiscono con il **re**, più grande degli altri.",
  "Le figure hanno il **busto di fronte** (frontale) e **gambe e testa di profilo**."]},
 {id:"m12",t:"Ripasso dalle mappe e dalle schede",p:"schede",punti:[
  "L'arte mesopotamica è uno **strumento del potere assoluto del sovrano**: ha **forme rigorose e modelli fissi** (sarà così anche in Egitto) e una **funzione celebrativa**.",
  "Ne fanno parte **edifici pubblici**, **decorazioni ricche**, **bassorilievi**, **piastrelle smaltate**, **mura possenti** e **tesori funerari**.",
  "I **rilievi** raccontano **guerre**, **cacce** e la **vita di corte**; sono in **bronzo o pietra** e pieni di **azione e movimento**.",
  "I **palazzi reali** avevano scalinate, portici, ampie sale e corridoi; i muri avevano **poche aperture** ed erano decorati con **terracotta smaltata**.",
  "I **Persiani** costruirono il **Palazzo di Persepoli** (voluto da **Dario I**). Il **Fregio degli arcieri** del **Palazzo di Susa** ha figure **rigide, di profilo e ripetute sempre uguali**.",
  "Le sculture dei Sumeri: **piccole statue di uomini in preghiera** (come **Gudea**, [2100 a.C.]) e le **prime tecniche di lavorazione dei metalli**."]}
],

 `<div class="games">${nErr?`<button class="game star" data-g="errori"><span class="ic">${ICON.redo}</span><b>Ripassa i tuoi errori</b><span>${nErr} domand${nErr===1?"a":"e"} da sistemare</span></button>`:""}${GAMES.map(g=>`<button class="game ${g.c||""}" data-g="${g.id}"><span class="ic">${ICON[g.i]}</span><b>${g.t}</b><span>${g.d}</span>${S.best[g.id]!=null?`<span class="best">Record: ${S.best[g.id]}</span>`:""}</button>`).join("")}</div>`;

function playShell(title,back){
 M().onclick=null;
 M().innerHTML=`<div class="play"><div class="phead"><button class="back" id="back">${ICON.left} Esci</button><h2>${esc(title)}</h2></div><div class="prog"><i id="pr" style="width:0"></i></div><div id="stage" class="play"></div></div>`;

}
const setProg=f=>{const p=$("#pr");if(p)p.style.width=Math.round(f*100)+"%"};
function record(id,score){S.giocate++;if(S.best[id]==null||score>S.best[id])S.best[id]=score;save()}
function endScreen(stage,{score,max,id,msg,extra="",again}){

/* --- motore domande a scelta (quiz, errori, che anno) --- */
let TIMER=null;
function runMC({id,title,items,back,vf=false}){
 const st=playShell(title,back);let i=0,score=0,pts=0,tries=0;
 const next=()=>{
  if(i>=items.length){
   return endScreen(st,{score,max:items.length,id,again:()=>GAMES.find(g=>g.id===id)?GAMES.find(g=>g.id===id).run():startErrori(),extra:`<p>Hai guadagnato <b>${pts}</b> punti.</p>`});
  }
  setProg(i/items.length);tries=0;
  const it=items[i];
  const opts=vf?["Vero","Falso"]:shuf(it.opts);
  st.innerHTML=`<div class="qbox"><div class="meta"><span>Domanda ${i+1} di ${items.length}</span><span>${it.pag?PG(it.pag):""}</span></div>${S.timer&&vf?'<div class="prog"><i id="tm" style="width:100%;background:var(--bronze)"></i></div>':""}<div class="qline"><div class="q">${esc(it.q)}</div>${spkBtn(it.q)}</div><div class="${vf?"vf":"opts"}">${opts.map(o=>`<button class="opt" data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div><div id="fb"></div></div>`;
  if(S.timer&&vf){let t=10;clearInterval(TIMER);TIMER=setInterval(()=>{t-=.1;const b=$("#tm");if(b)b.style.width=Math.max(0,t*10)+"%";if(t<=0){clearInterval(TIMER);tries=1;answer(null)}},100)}
  st.querySelector("."+(vf?"vf":"opts")).onclick=e=>{const b=e.target.closest(".opt");if(!b||b.disabled)return;answer(b)};
 };
 const answer=(b)=>{
  const it=items[i];const fb=$("#fb");
  if(b&&b.dataset.o===it.ok){
   clearInterval(TIMER);
   b.classList.add("ok");st.querySelectorAll(".opt").forEach(x=>x.disabled=true);
   const g=tries===0?10:5;pts+=g;if(tries===0)score++;
   if(tries===0&&it.key){delete S.err[it.key];S.ok[it.key]=1}
   const up=addPts(g);
   fb.innerHTML=`<div class="fb ok"><b>Giusto! +${g}</b>${it.exp?`<p>${esc(it.exp)}</p>`:""}${up?`<p><b>Sei salito di grado: ${RANKS[rank()][0]}!</b></p>`:""}</div><div class="row" style="margin-top:12px"><button class="btn" id="nx">Avanti</button></div>`;
   $("#nx").onclick=()=>{i++;next()};
  }else if(tries===0&&b){
   tries=1;b.classList.add("ko");b.disabled=true;
   fb.innerHTML=`<div class="fb hint"><b>Quasi! Riprova, hai un'altra possibilità.</b></div>`;
  }else{
   clearInterval(TIMER);
   if(b)b.classList.add("ko");
   st.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.dataset.o===it.ok)x.classList.add("ok")});
   if(it.key){S.err[it.key]=(S.err[it.key]||0)+1;save()}
   fb.innerHTML=`<div class="fb ko"><b>${b?"La risposta giusta è":"Tempo scaduto! Era"}: ${esc(it.ok)}</b><span class="pag">ripassa ${PG(it.pag)}</span>${it.exp?`<p>${esc(it.exp)}</p>`:""}</div><div class="row" style="margin-top:12px"><button class="btn" id="nx">Avanti</button></div>`;
   $("#nx").onclick=()=>{i++;next()};
  }
 };
 next();
}
const qItem=(q)=>({key:"Q|"+q[1],q:q[1],ok:q[2][0],opts:q[2],pag:sezOf(q[0]).p,exp:q[3],sez:q[0]});
const vfItem=(v)=>({key:"V|"+v[0],q:v[0],ok:v[1]?"Vero":"Falso",pag:v[3],exp:v[1]?"":"Correzione: "+v[2]});

function quizPick(){
 const st=playShell(CAP.quizT);
 st.innerHTML=`<div class="qbox">${marco("Su cosa vuoi allenarti?")}<div class="games"><button class="game star" data-s="all"><b>Tutto il programma</b><span>10 domande a sorpresa</span></button>${SEZ.map(s=>`<button class="game" data-s="${s.id}"><b style="font-size:17px">${esc(s.t)}</b><span>${PG(s.p)} · ${QS.filter(q=>q[0]===s.id).length} domande</span></button>`).join("")}</div></div>`;
 st.onclick=e=>{const b=e.target.closest("[data-s]");if(b)startQuiz(b.dataset.s)};
}
function startQuiz(sez){
 TAB="giochi";if($("#tabs"))shell();
 const pool=sez==="all"?QS:QS.filter(q=>q[0]===sez);
 const t=sez==="all"?CAP.quizT:sezOf(sez).t;

function startVF(){
 const st=playShell("Vero o falso");
 st.innerHTML=`<div class="qbox">${marco("12 frasi: vero o falso? Puoi giocare con il <b>timer</b> (10 secondi per frase) oppure con calma.")}<label class="toggle"><input type="checkbox" id="tmr" ${S.timer?"checked":""}> Gioca con il timer</label><div class="row"><button class="btn" id="go">Inizia</button></div></div>`;
 $("#tmr").onchange=e=>{S.timer=e.target.checked;save()};
 $("#go").onclick=()=>runMC({id:"vf",title:"Vero o falso",vf:true,items:shuf(VF).slice(0,12).map(vfItem)});
}
function startAnno(){
 const evs=shuf(EV).slice(0,10);
 runMC({id:"anno",title:"Che anno è?",items:evs.map(ev=>{
  const near=shuf(EV.filter(x=>x!==ev).sort((a,b)=>Math.abs(a[0]-ev[0])-Math.abs(b[0]-ev[0])).slice(0,6)).slice(0,3);
  return {key:"A|"+ev[2],q:ev[2],ok:ev[1],opts:[ev[1],...near.map(x=>x[1])],pag:ev[3],exp:""}})});
}
function startErrori(){
 const keys=shuf(Object.keys(S.err)).slice(0,10);
 const items=keys.map(k=>{const [t,txt]=[k.slice(0,1),k.slice(2)];
  if(t==="Q"){const q=QS.find(x=>x[1]===txt);return q&&qItem(q)}
  if(t==="V"){const v=VF.find(x=>x[0]===txt);return v&&Object.assign(vfItem(v),{opts:["Vero","Falso"]})}
  if(t==="A"){const ev=EV.find(x=>x[2]===txt);if(!ev)return null;const near=shuf(EV.filter(x=>x!==ev)).slice(0,3);return {key:k,q:ev[2],ok:ev[1],opts:[ev[1],...near.map(x=>x[1])],pag:ev[3],exp:""}}
 }).filter(Boolean);
 if(!items.length){TAB="giochi";return shell()}
 runMC({id:"errori",title:"Ripassa i tuoi errori",items});
}

/* --- Chi sono? --- */
function startChi(){

   }else{
    draw(true);st.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.dataset.o===c[0])x.classList.add("ok")});
    $("#fb").innerHTML=`<div class="fb ko"><b>Era ${esc(c[0])}</b><span class="pag">ripassa ${PG(c[2])}</span></div><div class="row" style="margin-top:12px"><button class="btn" id="nx">Avanti</button></div>`;
    $("#nx").onclick=()=>{i++;next()};
   }};
 };
 next();

/* --- Linea del tempo --- */
function startLinea(){
 const st=playShell("Linea del tempo");let round=0,score=0,errs=0;const R=3;
 const play=()=>{
  if(round>=R)return endScreen(st,{score,max:R*5,id:"linea",again:startLinea,extra:`<p>Errori: <b>${errs}</b></p>`});
  setProg(round/R);
  const set=shuf(EV).slice(0,5);const sorted=set.slice().sort((a,b)=>a[0]-b[0]);let k=0,miss=0;
  const draw=()=>{
   st.innerHTML=`<div class="qbox"><div class="meta"><span>Giro ${round+1} di ${R}</span><span>Tocca dal più antico al più recente</span></div><div class="placed">${sorted.slice(0,k).map(ev=>`<div><b>${ev[1]}</b><span>${esc(ev[2])}</span></div>`).join("")}</div><div class="chips">${set.filter(ev=>sorted.indexOf(ev)>=k).map(ev=>`<button class="chip" data-e="${EV.indexOf(ev)}">${esc(ev[2])}</button>`).join("")}</div><div id="fb"></div></div>`;
  };
  draw();
  st.onclick=e=>{const b=e.target.closest(".chip");if(!b)return;const ev=EV[+b.dataset.e];
   if(ev===sorted[k]){k++;if(miss===0)score++;miss=0;addPts(5);draw();
    if(k===5){$("#fb").innerHTML=`<div class="fb ok"><b>Linea completata!</b></div><div class="row" style="margin-top:12px"><button class="btn" id="nx">Avanti</button></div>`;$("#nx").onclick=()=>{round++;play()}}
   }else{miss++;errs++;b.classList.remove("ko");void b.offsetWidth;b.classList.add("ko");
    $("#fb").innerHTML=`<div class="fb hint">Non ancora: c'è un evento più antico. ${miss>=2?`Suggerimento: cerca «${esc(sorted[k][2])}».`:""}</div>`}};
 };
 play();
}

/* --- Parole e significati --- */
function startParole(){
 const st=playShell("Parole e significati");let round=0,score=0,errs=0;const R=3;
 const play=()=>{
  if(round>=R)return endScreen(st,{score,max:R*5,id:"parole",again:startParole,extra:`<p>Errori: <b>${errs}</b></p>`});
  setProg(round/R);
  const set=shuf(PAROLE).slice(0,5);const L=shuf(set),Rr=shuf(set);let sel=null,done=0,missed=new Set();
  st.innerHTML=`<div class="qbox"><div class="meta"><span>Giro ${round+1} di ${R}</span><span>Tocca una parola, poi il suo significato</span></div><div class="match"><div class="col" id="cl">${L.map(w=>`<button class="chip" data-w="${esc(w[0])}">${esc(w[0])}</button>`).join("")}</div><div class="col" id="cr">${Rr.map(w=>`<button class="chip" data-d="${esc(w[0])}">${esc(w[1])}</button>`).join("")}</div></div><div id="fb"></div></div>`;
  st.onclick=e=>{const b=e.target.closest(".chip");if(!b||b.classList.contains("done"))return;
   if(b.dataset.w){st.querySelectorAll("[data-w]").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");sel=b;speak(b.dataset.w);return}
   if(!sel){$("#fb").innerHTML='<div class="fb hint">Prima tocca una parola a sinistra.</div>';return}
   if(b.dataset.d===sel.dataset.w){b.classList.add("done");sel.classList.remove("sel");sel.classList.add("done");if(!missed.has(sel.dataset.w))score++;sel=null;done++;addPts(5);$("#fb").innerHTML="";
    if(done===5){$("#fb").innerHTML=`<div class="fb ok"><b>Tutte collegate!</b></div><div class="row" style="margin-top:12px"><button class="btn" id="nx">Avanti</button></div>`;$("#nx").onclick=()=>{round++;play()}}
   }else{errs++;missed.add(sel.dataset.w);b.classList.remove("ko");void b.offsetWidth;b.classList.add("ko")}};
 };
 play();
}

function verificaHome(){
 const last=S.best.verifica;
 M().innerHTML=marco("Questa è una <b>prova generale</b> della verifica: 20 domande su tutto il capitolo, una sola possibilità per domanda, e alla fine il voto in decimi. Prenditi il tuo tempo!")+

function startVerifica(){
 const st=playShell("Prova di verifica",()=>{TAB="verifica";shell()});

 const ans=shuf(EV.filter(e=>e[4])).slice(0,3).map(ev=>{const near=shuf(EV.filter(x=>x!==ev)).slice(0,3);return {key:"A|"+ev[2],q:"In che anno? "+ev[2],ok:ev[1],opts:[ev[1],...near.map(x=>x[1])],pag:ev[3],exp:""}});
 const items=shuf([...qs,...vfs,...ans]);const res=[];let i=0;

 const fine=()=>{

 <div class="panel" style="display:flex;flex-direction:column;gap:12px"><div class="secLabel">${CAP.ranksT}</div><div class="ranks">${RANKS.map((x,k)=>`<div class="rk ${k===r?"on":k>r?"lock":""}"><b>${x[0]}</b><span>${x[1]} punti</span></div>`).join("")}</div></div>
 <div class="panel" style="display:flex;flex-direction:column;gap:10px"><div class="secLabel">Domande del quiz indovinate <small>${okQ} su ${totQ}</small></div>${SEZ.map(s=>{const qs=QS.filter(q=>q[0]===s.id);const o=qs.filter(q=>S.ok["Q|"+q[1]]).length;return `<div class="sezbar"><span>${esc(s.t)}</span><span class="bar"><i style="width:${Math.round(o/qs.length*100)}%"></i></span><span>${o}/${qs.length}</span></div>`}).join("")}</div>
 <div class="panel confirm" id="rs">${confirmReset?`<span>Cancellare tutti i punti e i progressi?</span><button class="btn small" id="rsY">Sì, cancella</button><button class="btn small ghost" id="rsN">No</button>`:`<button class="btn small ghost" id="rsA">Ricomincia da zero</button><span class="note">I progressi restano salvati solo su questo dispositivo.</span>`}</div>`;
 const a=$("#rsA"),y=$("#rsY"),n=$("#rsN");
 if(a)a.onclick=()=>{confirmReset=true;prog()};
 if(n)n.onclick=()=>{confirmReset=false;prog()};
 if(y)y.onclick=()=>{S={pts:0,best:{},err:{},ok:{},giocate:0,timer:S.timer};save();confirmReset=false;head();prog()};
}

useCap(CAP);
shell();
</script>
</body>
